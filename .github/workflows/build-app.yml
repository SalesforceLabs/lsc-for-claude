name: Build Desktop App

# Package the Roz for LSC desktop app and upload the installers as
# per-run workflow artifacts (downloadable from the run summary page).
# Runs on pushes to main/feature branches and on-demand via the Actions tab.
on:
  push:
    branches: ["main", "feature/**"]
  workflow_dispatch:

# One in-flight build per ref; cancel superseded runs to save minutes.
concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips native install scripts (better-sqlite3's
        # node-gyp rebuild) that otherwise crash `npm ci` on the macOS runner
        # ("Exit handler never called!"). electron-builder rebuilds native
        # modules against the Electron ABI during packaging anyway, so the
        # system-Node compile here is redundant. Bin links (tsc, vite) are
        # still created.
        run: npm ci --ignore-scripts

      - name: Package desktop app (macOS)
        # electron:pack = build MCP server -> build Electron main+renderer ->
        # electron-builder. On a macOS runner electron-builder emits the mac
        # targets from electron-builder.yml (dmg + zip) and rebuilds the
        # better-sqlite3 native module for Electron's ABI.
        run: npm run electron:pack
        env:
          # No signing certs in CI — produce an unsigned build instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lsc-assistant-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
