name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # macOS runner so electron-builder can produce the signed-capable mac
    # installers (.dmg/.zip) alongside the release.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify version matches tag
        # Lockstep guard: the tag must equal the version in package.json,
        # plugin.json, and marketplace.json. Fail fast before the long build.
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$TAG"

      - name: Install dependencies
        # --ignore-scripts skips native install scripts (better-sqlite3's
        # node-gyp rebuild) that otherwise crash `npm ci` on the macOS runner
        # ("Exit handler never called!"). electron-builder rebuilds native
        # modules against the Electron ABI during packaging anyway. Bin links
        # (tsc, vite) are still created.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Import signing certificate
        # A job-scoped keychain holding the Developer ID cert, with codesign
        # allowed to use the key without a prompt. electron-builder's own
        # temp-keychain handling can stall on a key ACL prompt nobody can answer.
        # Skipped when the secrets aren't set, so the build comes out unsigned.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No signing secrets; building unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/roz-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"

          # macOS `base64` truncates this long single-line secret, so decode
          # the .p12 with Node.
          CERT="$RUNNER_TEMP/cert.p12"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/cert.p12", Buffer.from(process.env.CSC_LINK,"base64"))'
          security import "$CERT" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm -f "$CERT"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          EXISTING="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

      - name: Package desktop app (macOS)
        # Builds the MCP server + Electron bundles, then electron-builder emits
        # the mac dmg/zip into release/ and rebuilds native modules for Electron.
        # Signs with the identity in the job-scoped keychain and notarizes via
        # notarytool; with no keychain it finds no identity and builds unsigned.
        run: npm run electron:pack
        env:
          CSC_KEYCHAIN: ${{ env.SIGN_KEYCHAIN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.SIGN_KEYCHAIN != '' }}
          # Notarization via notarytool (app-specific password route).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload signed installers
        # The SalesforceLabs org has an IP allow list that GitHub's hosted
        # runners aren't on, so the release step below gets a 403. Artifacts go
        # through a different service and do upload; publish them from an
        # allowed network with scripts/publish-release.sh <tag>.
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        # Fails while the org's IP allow list blocks the runner (see above);
        # starts working by itself once the allow list lets Actions through.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # latest-mac.yml and the .blockmap files are the update feed: an
          # installed app reads latest-mac.yml to find the newest version.
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

      - name: Clean up signing keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true
