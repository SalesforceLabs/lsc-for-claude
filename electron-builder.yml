appId: com.salesforce.lsc-assistant
productName: LSC Assistant
# Space-free artifact names. GitHub Releases rewrites spaces in asset names,
# which would desync them from the URLs latest-mac.yml points at.
artifactName: LSC-Assistant-${version}-${arch}.${ext}
directories:
  output: release
# Update feed. electron-builder writes latest-mac.yml (and .blockmap files)
# pointing at the GitHub Release assets; `--publish never` in electron:pack
# still generates them, and the Release workflow attaches them to the release.
publish:
  provider: github
  owner: SalesforceLabs
  repo: lsc-for-claude
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - dist/**/*
  - knowledge/**/*
  - skills/**/*
  - commands/**/*
  - agents/**/*
  - CLAUDE.md
  - package.json
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Signing + notarization. Active only when the CI env provides a cert
  # (CSC_LINK/CSC_KEY_PASSWORD) and Apple creds (APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID). Without them electron-builder
  # produces an unsigned build and skips notarization — CI still passes.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
    - deb
