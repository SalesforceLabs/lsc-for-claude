# LSC Product Management Configuration Validation Rules
# ===================================================
# Rules to validate Product Management configuration including
# Product2 records, LifeSciMarketableProduct hierarchy, ProductGuidance,
# product territory alignment, and mobile cache.
#
# Verified object names:
#   - Product2 (standard Salesforce)
#   - LifeSciMarketableProduct (standard)
#   - ProductGuidance (standard)
#   - ProductTerritoryAvailability (standard)
#   - LifeSciProductAcctRstrc (standard)
#   - LifeSciMobileMetadataRecord (standard)

schema_version: "1.0"
category_name: "Product Management Configuration"
description: |
  Validation rules for LSC Product Management configuration.
  Covers Product2 records, LifeSciMarketableProduct hierarchy, ProductGuidance,
  product territory alignment, product restrictions, and mobile cache requirements.

rules:
  # ===========================================================================
  # SECTION 1: Product2 Base Records
  # ===========================================================================

  - id: product-001
    name: Product2 records exist in the org
    description: |
      Verifies that at least one Product2 record exists. Product2 is the base
      Salesforce product object that underlies all LSC product management.
      Without Product2 records, no products can be configured for detailing,
      sample management, or content delivery. Each LifeSciMarketableProduct
      must link to a Product2 record.
    category: configuration
    stage: data
    studio_surface: objects
    severity: error
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM Product2
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, IsActive, ProductCode, RecordTypeId
        FROM Product2
        LIMIT 10
    symptoms:
      - "No products available in Admin Console"
      - "Cannot create LifeSciMarketableProduct"
      - "Product selection is empty during visit"
    resolution:
      steps:
        - "Navigate to Setup > Object Manager > Product2"
        - "Create Product2 records for each product in your catalog"
        - "Set ProductCode, IsActive = true, and appropriate RecordType"
        - "Link Product2 records to LifeSciMarketableProduct records"
      ui_path: "Setup > Object Manager > Product2"
    tags: [product, configuration, product2]

  - id: product-002
    name: Active Product2 records exist
    description: |
      Checks whether active Product2 records exist. Inactive products are not
      available for detailing, sample management, or content delivery. Field
      reps will not see inactive products in their product lists during visits.
      This is a warning because organizations may have product records that are
      intentionally inactive (archived products, discontinued lines, etc.).
    category: configuration
    stage: data
    studio_surface: objects
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM Product2
        WHERE IsActive = true
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, IsActive, ProductCode
        FROM Product2
        ORDER BY IsActive DESC, Name
        LIMIT 20
    symptoms:
      - "No products showing in product lists"
      - "Field reps cannot detail any products"
      - "Product selection empty in mobile app"
    resolution:
      steps:
        - "Navigate to Setup > Object Manager > Product2"
        - "Query for inactive products: SELECT Id, Name FROM Product2 WHERE IsActive = false"
        - "Update IsActive = true for products that should be available"
        - "Verify products appear in Admin Console > Product Hierarchy"
      ui_path: "Setup > Object Manager > Product2"
    tags: [product, configuration, product2, active]

  # ===========================================================================
  # SECTION 2: LifeSciMarketableProduct (LSC Product Wrapper)
  # ===========================================================================

  - id: product-003
    name: LifeSciMarketableProduct records exist
    description: |
      Verifies that at least one LifeSciMarketableProduct record exists.
      LifeSciMarketableProduct is the LSC product wrapper that carries product
      type, hierarchy, territory availability, and metadata. It is the entity
      used throughout LSC for detailing, sample management, and content
      delivery. Without these records no products are available in LSC modules.
    category: configuration
    stage: data
    studio_surface: objects
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciMarketableProduct
      expect: "count > 0"
    symptoms:
      - "Product hierarchy empty in Admin Console"
      - "No products available during visits"
      - "Product management module not working"
    resolution:
      steps:
        - "Navigate to Admin Console > Product Hierarchy"
        - "Create LifeSciMarketableProduct records for each product"
        - "Set Type (Therapeutic Area, Market, Brand, Indication, Product)"
        - "Set ParentProductId to build hierarchy (NULL for top-level)"
        - "Link to base Product2 record (ProductId)"
      ui_path: "Admin Console > Product Hierarchy"
    tags: [product, configuration, lifescimarketableproduct]

  - id: product-004
    name: Active LifeSciMarketableProduct records exist
    description: |
      Checks whether active LifeSciMarketableProduct records exist. Inactive
      records are not available in LSC modules even if the underlying Product2
      is active: reps will not see them in detailing lists, sample management
      or activity planning.
    category: configuration
    stage: data
    studio_surface: objects
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciMarketableProduct
        WHERE IsActive = true
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Type, IsActive, Product.Name
        FROM LifeSciMarketableProduct
        ORDER BY Name
        LIMIT 20
    symptoms:
      - "Products not available for detailing"
      - "Product list empty in mobile app"
      - "Cannot select product in activity plan"
    resolution:
      steps:
        - "Navigate to Admin Console > Product Hierarchy"
        - "Set IsActive = true on the marketable products that should be available"
      ui_path: "Admin Console > Product Hierarchy"
    tags: [product, configuration, lifescimarketableproduct, active]

  # ===========================================================================
  # SECTION 3: ProductGuidance (Messages and Objectives)
  # ===========================================================================

  - id: product-005
    name: ProductGuidance records exist (messages and objectives)
    description: |
      Checks whether ProductGuidance records exist. They hold the key messages
      and objectives reps see when detailing a product, and Next Best Message
      recommends from them. Informational: guidance is optional.
    category: configuration
    stage: data
    studio_surface: objects
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM ProductGuidance
      expect: "count > 0"
    symptoms:
      - "No messages available during detailing"
      - "Product objectives not showing"
      - "Next Best Message has nothing to recommend"
    resolution:
      steps:
        - "Create ProductGuidance records with Type = Message or Objective"
        - "Set ProductReferenceRecordId to the marketable product"
        - "Set Is Active and the effective dates"
      ui_path: "Admin Console > Product Messages & Objectives"
    tags: [product, configuration, guidance, messages, objectives]

  - id: product-006
    name: ProductGuidance is in effect today
    description: |
      Checks that at least one active ProductGuidance record is within its
      effective dates today. Guidance whose end date has passed (or whose start
      date is in the future) is not shown to reps, even though it is marked
      active.
    category: configuration
    stage: data
    studio_surface: objects
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM ProductGuidance
        WHERE IsActive = true
        AND (EffectiveStartDate = null OR EffectiveStartDate <= TODAY)
        AND (EffectiveEndDate = null OR EffectiveEndDate >= TODAY)
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Type, IsActive, EffectiveStartDate, EffectiveEndDate
        FROM ProductGuidance
        ORDER BY EffectiveEndDate DESC
        LIMIT 10
    symptoms:
      - "Messages disappeared from detailing"
      - "Objectives missing for the current quarter"
    resolution:
      steps:
        - "Extend the effective end date of current messages, or create new guidance for the period"
      ui_path: "Admin Console > Product Messages & Objectives"
    prerequisites: [product-005]
    tags: [product, configuration, guidance, dates]

  # ===========================================================================
  # SECTION 4: Product Hierarchy
  # ===========================================================================

  - id: product-007
    name: Every active product has a parent in the hierarchy
    description: |
      Checks that no active marketable product of Type = Product is a root with
      no ParentProductId. The product tree, message inheritance and brand-level
      reporting all depend on products hanging off a brand or indication.
    category: configuration
    stage: config
    studio_surface: objects
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciMarketableProduct
        WHERE IsActive = true
        AND Type = 'Product'
        AND ParentProductId = null
      expect: "count == 0"
      error_detail_query: >
        SELECT Id, Name, Type, ParentProductId
        FROM LifeSciMarketableProduct
        WHERE IsActive = true
        AND Type = 'Product'
        AND ParentProductId = null
        LIMIT 20
    symptoms:
      - "Product appears at the top level of the product tree"
      - "Brand messages not shown for a product"
    resolution:
      steps:
        - "Navigate to Admin Console > Product Hierarchy"
        - "Set the parent brand or indication on each product listed"
      ui_path: "Admin Console > Product Hierarchy"
    tags: [product, configuration, hierarchy]

  # ===========================================================================
  # SECTION 5: Territory Availability
  # ===========================================================================

  - id: product-008
    name: Products are made available to territories
    description: |
      Checks that ProductTerritoryAvailability records exist. They decide which
      products each territory's reps can detail and sample. Without them, reps
      see no products (or all of them, depending on the org's availability
      settings).
    category: configuration
    stage: config
    studio_surface: objects
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM ProductTerritoryAvailability
      expect: "count > 0"
    symptoms:
      - "Reps cannot see the product list for their territory"
      - "Product shows for one territory but not another"
    resolution:
      steps:
        - "Navigate to Admin Console > Product Hierarchy > Territory Availability"
        - "Add the products each territory sells"
      ui_path: "Admin Console > Product Hierarchy"
    tags: [product, configuration, territory]

  # ===========================================================================
  # SECTION 6: Mobile Metadata Cache for Products
  # ===========================================================================

  - id: product-010
    name: Mobile metadata cache active for product objects
    description: |
      Verifies that mobile metadata cache is active. Product management on mobile
      requires an active metadata cache that includes LifeSciMarketableProduct,
      ProductGuidance, and related objects. Without active cache, product data
      will not sync to mobile devices and product detailing will not work offline.
      Field reps will not see products, messages, or objectives on their iPads.
    category: metadata-cache
    stage: mobile
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciMobileMetadataRecord
        WHERE Status IN ('Active', 'Published')
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Status, IntegrationStatus, LastModifiedDate
        FROM LifeSciMobileMetadataRecord
        ORDER BY LastModifiedDate DESC
        LIMIT 10
    symptoms:
      - "Products not syncing to mobile"
      - "Product detailing not available offline"
      - "Device sync transaction record was not found"
      - "Messages and objectives missing on mobile"
    resolution:
      steps:
        - "Navigate to Admin Console > Mobile > Object Metadata Cache Configuration"
        - "Verify LifeSciMarketableProduct, ProductGuidance, and related objects are included in DB Schema"
        - "Regenerate metadata cache for affected profiles"
        - "Have users sync their mobile devices"
      ui_path: "Admin Console > Mobile > Object Metadata Cache Configuration"
    tags: [product, mobile, cache]

# ===========================================================================
# Validation Groups
# ===========================================================================
# Groups define which rules to run together for specific scenarios

groups:
  product-config-check:
    name: "Product Configuration Check"
    description: "Full product management configuration check - Product2, LifeSciMarketableProduct, ProductGuidance, hierarchy, territory alignment, and mobile cache"
    rules:
      - product-001
      - product-002
      - product-003
      - product-004
      - product-005
      - product-006
      - product-007
      - product-008
      - product-010

  product-core:
    name: "Product Core Check"
    description: "Core product checks - Product2 and LifeSciMarketableProduct records"
    rules:
      - product-001
      - product-002
      - product-003
      - product-004

  product-guidance:
    name: "Product Guidance Check"
    description: "Product messages and objectives checks - ProductGuidance records"
    rules:
      - product-005
      - product-006

  product-hierarchy:
    name: "Product Hierarchy Check"
    description: "Product hierarchy and territory alignment checks"
    rules:
      - product-007
      - product-008

  product-mobile:
    name: "Product Mobile Check"
    description: "Mobile-specific product checks - metadata cache requirements"
    rules:
      - product-010

  pre-deployment-product:
    name: "Pre-Deployment Product Check"
    description: "Run before deploying product management to users - all critical checks"
    rules:
      - product-001
      - product-002
      - product-003
      - product-004
      - product-010
