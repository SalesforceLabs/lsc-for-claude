# LSC Surveys Configuration Validation Rules
# ===========================================
# Rules to validate Surveys configuration including
# survey records, versions, questions, invitations, responses,
# and mobile metadata cache.
#
# Verified object names:
#   - Survey (standard)
#   - SurveyVersion (standard)
#   - SurveyPage (standard)
#   - SurveyQuestion (standard)
#   - SurveyQuestionChoice (standard)
#   - SurveyInvitation (standard)
#   - SurveyResponseOffline, SurveyQstnResponseOffline (what the iPad writes)
#   - SurveyResponse, SurveyQuestionResponse (standard web responses)
#   - SurveyShare (standard)
#   - LifeSciMobileMetadataRecord (standard)

schema_version: "1.0"
category_name: "Surveys Configuration"
description: |
  Validation rules for LSC Surveys configuration.
  Covers survey records, versions, questions, sharing, responses,
  and mobile cache requirements.

rules:
  # ===========================================================================
  # SECTION 1: Survey Definition Records
  # ===========================================================================

  - id: survey-001
    name: Survey records exist
    description: |
      Verifies that at least one Survey record exists in the org.
      Surveys are required for capturing feedback from HCPs during visits,
      content presentations, or directly from account profiles. Without
      surveys configured, field reps will not be able to collect structured
      feedback or measure customer satisfaction.
    category: configuration
    severity: error
    stage: data
    studio_surface: objects
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM Survey
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, SurveyType, ActiveVersionId, Description
        FROM Survey
        ORDER BY Name
        LIMIT 10
    symptoms:
      - "No surveys available for field reps"
      - "Survey launch button not appearing"
      - "Cannot capture HCP feedback"
    resolution:
      steps:
        - "Navigate to App Launcher > Surveys"
        - "Click 'New Survey' to create a survey"
        - "Add survey pages and questions"
        - "Configure question types (text, choice, rating, date, etc.)"
        - "Activate the survey to make it available to users"
      ui_path: "App Launcher > Surveys"
    tags: [survey, configuration]

  # ===========================================================================
  # SECTION 2: Survey Versions
  # ===========================================================================

  - id: survey-002
    name: Active SurveyVersion records exist
    description: |
      Checks that at least one SurveyVersion with SurveyStatus = 'Active' exists.
      Survey versions contain the actual survey content (pages, questions, logic).
      A survey must have an active version for reps to launch it. Without an
      active version, the survey will appear in the list but cannot be opened.
      The ActiveVersionId field on the Survey record points to the active version.
    category: configuration
    severity: warning
    stage: data
    studio_surface: objects
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM SurveyVersion
        WHERE SurveyStatus = 'Active'
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, SurveyId, Survey.Name, SurveyStatus, VersionNumber
        FROM SurveyVersion
        ORDER BY Name
        LIMIT 10
    symptoms:
      - "Survey appears in list but cannot be launched"
      - "Error opening survey"
      - "Survey shows as inactive"
      - "ActiveVersionId is null on Survey record"
    resolution:
      steps:
        - "Open the survey in Survey Builder"
        - "Review all questions and branching logic"
        - "Click 'Activate' to create an active version"
        - "Verify the Survey.ActiveVersionId is populated"
        - "Test survey launch on desktop before deploying to mobile"
      ui_path: "Survey Builder > Activate"
    tags: [survey, configuration, version]

  # ===========================================================================
  # SECTION 3: Survey Questions
  # ===========================================================================

  - id: survey-003
    name: SurveyQuestion records exist
    description: |
      Checks that survey questions have been configured. SurveyQuestion records
      define the questions displayed in the survey. Without questions, the
      survey will be empty and users will not be able to collect any data.
      Questions should cover the feedback or information needed from HCPs.
    category: configuration
    severity: warning
    stage: data
    studio_surface: objects
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM SurveyQuestion
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, QuestionName, QuestionType, SurveyVersionId
        FROM SurveyQuestion
        LIMIT 10
    symptoms:
      - "Survey opens but shows no questions"
      - "Empty survey page"
      - "Cannot answer any questions"
      - "Survey completion fails"
    resolution:
      steps:
        - "Open the survey in Survey Builder"
        - "Add questions to survey pages"
        - "Configure question types (text, multiple choice, rating, etc.)"
        - "Set up question dependencies and branching logic if needed"
        - "Activate the survey version"
        - "Test survey on desktop before deploying to mobile"
      ui_path: "Survey Builder > Add Questions"
    tags: [survey, configuration, questions]

  # ===========================================================================
  # SECTION 4: Survey Invitations
  # ===========================================================================

  - id: survey-004
    name: SurveyInvitation records exist
    description: |
      Checks whether SurveyInvitation records exist. Survey invitations are
      created when surveys are sent to respondents via email or other channels.
      For LSC mobile surveys launched during visits, invitations may not be
      required as surveys are launched directly. However, for email-based
      surveys or external respondents, invitations track who was sent a survey.
      This is informational only and does not block survey functionality.
    category: configuration
    severity: info
    stage: data
    studio_surface: objects
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM SurveyInvitation
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, SurveyId, Survey.Name, ResponseStatus
        FROM SurveyInvitation
        LIMIT 10
    symptoms:
      - "Cannot track who was sent surveys"
      - "Survey invitation links not generated"
      - "External survey respondents cannot access survey"
    resolution:
      steps:
        - "For email-based surveys, send survey invitations via Survey Builder"
        - "For mobile-launched surveys, invitations are not required"
        - "Check SurveyInvitation records to track sent invitations"
        - "Verify invitation links are accessible to recipients"
      ui_path: "Survey Builder > Send Survey"
    tags: [survey, invitations, tracking]

  # ===========================================================================
  # SECTION 5: Survey Responses
  # ===========================================================================

  - id: survey-005
    name: Survey responses have been captured
    description: |
      Checks whether Survey responses have been captured. Survey responses are created
      when a survey is completed and submitted. If no responses exist, either
      surveys have not been launched yet, or there are configuration issues
      preventing response creation. For new implementations, this is expected.
      For existing implementations, lack of responses may indicate permission
      issues, mobile cache problems, or survey sharing configuration errors.
    category: configuration
    severity: info
    stage: data
    studio_surface: objects
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM SurveyResponseOffline
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, SurveyName, Status, CompletionDateTime
        FROM SurveyResponseOffline
        ORDER BY CompletionDateTime DESC
        LIMIT 10
    symptoms:
      - "No survey data being captured"
      - "Completed surveys not creating records"
      - "Cannot view survey responses"
      - "Analytics showing zero responses"
    resolution:
      steps:
        - "Verify surveys are active and shared correctly"
        - "Check the DB Schema includes SurveyResponseOffline"
        - "Verify users have Create permission on SurveyResponseOffline"
        - "Test survey completion on desktop and mobile"
        - "Check debug logs for trigger errors on SurveyResponseOffline"
        - "For mobile, ensure device has synced after survey completion"
      ui_path: "Survey > View Responses"
    tags: [survey, responses, data]

  # ===========================================================================
  # SECTION 6: Mobile Metadata Cache
  # ===========================================================================

  - id: survey-006
    name: A mobile metadata cache has been published
    description: |
      Verifies that mobile metadata cache is active. Survey management on mobile
      requires an active metadata cache that includes Survey, SurveyVersion,
      SurveyPage, SurveyQuestion, SurveyQuestionChoice, SurveyInvitation,
      SurveyResponseOffline, and SurveyQstnResponseOffline objects. Without active cache,
      surveys will not be available on mobile devices, offline survey completion
      will not work, and survey data will not sync correctly.
    category: metadata-cache
    severity: warning
    stage: mobile
    studio_surface: dbSchema
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciMobileMetadataRecord
        WHERE Status = 'Active'
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Status, LastModifiedDate
        FROM LifeSciMobileMetadataRecord
        ORDER BY LastModifiedDate DESC
        LIMIT 10
    symptoms:
      - "Surveys not appearing on mobile"
      - "Survey list is empty on iPad"
      - "Cannot launch surveys offline"
      - "Survey responses not syncing to Salesforce"
      - "Device sync transaction record was not found"
    resolution:
      steps:
        - "Navigate to Admin Console > Mobile > Object Metadata Cache Configuration"
        - "Verify Survey, SurveyVersion, SurveyPage, SurveyQuestion, SurveyQuestionChoice are in DB Schema"
        - "Verify SurveyResponseOffline, SurveyQstnResponseOffline are in DB Schema"
        - "Regenerate metadata cache for affected profiles"
        - "Use generate_mobile_metadata_cache tool with appropriate profile names"
        - "Have users sync their mobile devices after cache regeneration"
      ui_path: "Admin Console > Mobile > Object Metadata Cache Configuration"
    tags: [survey, mobile, cache]

# ===========================================================================
# Validation Groups
# ===========================================================================
# Groups define which rules to run together for specific scenarios

groups:
  surveys-config-check:
    name: "Surveys Configuration Check"
    description: "Full surveys configuration check - survey records, versions, questions, invitations, responses, and mobile cache"
    rules:
      - survey-001
      - survey-002
      - survey-003
      - survey-004
      - survey-005
      - survey-006

  surveys-core:
    name: "Surveys Core Configuration"
    description: "Core survey setup - survey records, versions, and questions"
    rules:
      - survey-001
      - survey-002
      - survey-003

  surveys-responses:
    name: "Survey Responses Check"
    description: "Check survey response data collection"
    rules:
      - survey-004
      - survey-005

  surveys-mobile:
    name: "Surveys Mobile Check"
    description: "Mobile-specific survey checks - metadata cache and sync requirements"
    rules:
      - survey-006

  pre-deployment-surveys:
    name: "Pre-Deployment Surveys Check"
    description: "Run before deploying surveys to field reps - all critical checks"
    rules:
      - survey-001
      - survey-002
      - survey-003
      - survey-006
